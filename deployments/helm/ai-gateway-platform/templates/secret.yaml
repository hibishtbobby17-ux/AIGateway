{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-gateway-platform.fullname" . }}-secret
  labels:
    {{- include "ai-gateway-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  GATEWAY_SIGNING_KEY_ENCRYPTION_KEY: {{ .Values.secrets.signingKeyEncryptionKey | quote }}
  {{- $dbPass := "" }}
  {{- if .Values.database.internal.enabled }}
  {{- $dbPass = .Values.database.internal.password }}
  {{- else }}
  {{- $dbPass = .Values.database.external.password }}
  {{- end }}
  DATABASE_PASSWORD: {{ $dbPass | quote }}
  {{- $dbHost := include "ai-gateway-platform.databaseHost" . }}
  {{- $dbPort := include "ai-gateway-platform.databasePort" . }}
  {{- $dbName := include "ai-gateway-platform.databaseName" . }}
  {{- $dbUser := include "ai-gateway-platform.databaseUser" . }}
  {{- $dbSsl := ternary "disable" .Values.database.external.sslmode .Values.database.internal.enabled }}
  GATEWAY_DATABASE_URL: "postgres://{{ $dbUser }}:{{ $dbPass }}@{{ $dbHost }}:{{ $dbPort }}/{{ $dbName }}?sslmode={{ $dbSsl }}"
{{- end }}
