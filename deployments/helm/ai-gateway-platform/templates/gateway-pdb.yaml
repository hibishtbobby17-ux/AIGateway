{{- if .Values.gateway.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ai-gateway-platform.fullname" . }}-gateway
  labels:
    {{- include "ai-gateway-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  minAvailable: {{ .Values.gateway.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ai-gateway-platform.gateway.selectorLabels" . | nindent 6 }}
{{- end }}
