apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway-platform.fullname" . }}-control-plane
  labels:
    {{- include "ai-gateway-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - name: http
      port: {{ .Values.controlPlane.service.port }}
      targetPort: http-admin
      protocol: TCP
  selector:
    {{- include "ai-gateway-platform.controlPlane.selectorLabels" . | nindent 4 }}
