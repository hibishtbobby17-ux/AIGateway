{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-gateway-platform.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "ai-gateway-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-gateway-platform.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "ai-gateway-platform.fullname" . }}
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "ai-gateway-platform.fullname" . }}-config
            - secretRef:
                name: {{ include "ai-gateway-platform.fullname" . }}-secret
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
