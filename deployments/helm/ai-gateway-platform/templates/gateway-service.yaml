apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway-platform.fullname" . }}-gateway
  labels:
    {{- include "ai-gateway-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http-gateway
      protocol: TCP
    - name: metrics
      port: {{ .Values.gateway.service.metricsPort }}
      targetPort: http-metrics
      protocol: TCP
  selector:
    {{- include "ai-gateway-platform.gateway.selectorLabels" . | nindent 4 }}
