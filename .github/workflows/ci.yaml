name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Run unit & integration tests
        run: go test -v -race -cover ./...

      - name: Build gateway binary
        run: go build -v ./cmd/gateway

      - name: Build control-plane binary
        run: go build -v ./cmd/control-plane

      - name: Build migrate CLI
        run: go build -v ./cmd/migrate
