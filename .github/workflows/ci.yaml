name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Test & Build Go Services (Gateway & Ingest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build gateway binary
        run: go build -v ./gateway

      - name: Build ingest binary
        run: go build -v ./ingest

      - name: Run Go tests
        run: go test -v ./gateway/... ./ingest/...

  test-console:
    name: Test & Build Console (Next.js / Node API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package.json

      - name: Install dependencies
        working-directory: ./console
        run: npm ci || npm install

      - name: Build console production bundle
        working-directory: ./console
        run: npm run build
