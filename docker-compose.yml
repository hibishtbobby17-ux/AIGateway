services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-gateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-gateway_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-gateway_dev}"]
      interval: 4s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 4s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: ai-gateway-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  console:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.console
    container_name: ai-console
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:-gateway}@postgres:5432/${POSTGRES_DB:-gateway_dev}?sslmode=disable
      CONSOLE_JWT_SECRET: ${CONSOLE_JWT_SECRET:-super-secret-jwt-key-for-console-phase1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aigateway.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!@#}
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      ALLOW_LOCAL_EGRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 4s
      timeout: 3s
      retries: 5

  ingest:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.ingest
    container_name: ai-ingest
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      INGEST_PORT: "8082"
      REDIS_ADDR: "redis:6379"
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:-gateway}@postgres:5432/${POSTGRES_DB:-gateway_dev}?sslmode=disable
      CLICKHOUSE_URL: "http://clickhouse:8123"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: "8080"
      CONSOLE_URL: "http://console:3000"
      INGEST_URL: "http://ingest:8082"
      GATEWAY_SECRET: "dev-gateway-secret"
      GATEWAY_ID: "gateway-default-01"
      SPOOL_FILE_PATH: "/tmp/gateway_events.spool"
    depends_on:
      console:
        condition: service_healthy
      ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
